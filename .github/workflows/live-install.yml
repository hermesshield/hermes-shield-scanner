name: live-install

# Proves the PUBLISHED package installs from PyPI and runs on every OS a user might have.
# This installs `hermes-shield-scanner` from the real index — not the local checkout.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  install-from-pypi:
    name: pip install from PyPI (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from PyPI (as a user would)
        run: python -m pip install hermes-shield-scanner

      - name: Version check
        run: hermes-shield --version

      - name: Demo scan smoke test
        run: hermes-shield demo
