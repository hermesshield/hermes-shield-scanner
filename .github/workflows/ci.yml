name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, stdlib-only core)
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        # The core suite runs on every OS. The --prove sandbox tests require Linux + bubblewrap; they
        # skip automatically off-Linux (see tests marked for bwrap). No test may fail for lack of bwrap.
        run: python -m pytest -q
      - name: Smoke test — hermes-shield demo
        # A real red report from the bundled inert fixture in ~10s; proves install + entrypoint + report.
        run: hermes-shield demo --quiet

  build:
    name: build wheel + sdist (artefact only, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
